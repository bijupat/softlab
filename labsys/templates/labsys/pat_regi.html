{% extends "labsys/layout.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block title %}Index{% endblock %}
{% block body %}
    <form action="{% url 'PatReg' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3 row">
            {{ form|crispy  }}
            <br>
            <input class="btn btn-primary btn-sm" type="submit">
        </div>
    </form>
{% endblock %}
