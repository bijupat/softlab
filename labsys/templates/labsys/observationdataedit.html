{% extends "labsys/layout.html" %}
{% load static %}
{% block title %}Index{% endblock %}
{% block head %}
  <script src="{% static 'labsys\index.js' %}" defer></script>
{% endblock %}
{% block body %}
<form action="{% url 'labsys:observationdataedit' observation.id     %}" method="post">
    {% csrf_token %}
    <div class="form-row">
    <div class="form-group col-md-4">
      <label for="inputunit">Unit</label>
      <input name = "unit" type="text" class="form-control" id="inputunit" value = "{{observation.unit}}" >
    </div>
    <div class="form-group col-md-4">
      <label for="inputPassword4">High Value</label>
      <input Name = "high" type="text" class="form-control" id="inputhigh" value = "{{observation.high}}">
    </div>
    <div class="form-group col-md-4">
      <label for="inputinterpretation">Low Value</label>
      <input name = "low" type="text" class="form-control" id="inputlow" value = "{{observation.low}}">
    </div>
  </div>



  <div class="form-group">
    <label for="inputAddress">Interpretation</label>
    <input name="interpretation" type="text" class="form-control" id="inputinterpretation" style="width:100%" value = "{{observation.interpretation|default:""}}">
  </div>
  <div class="form-group">
    <label for="inputAddress2">Note</label>
    <input name="note" type="text" class="form-control" id="inputnote" value = "{{observation.note|default:""}}" rows="5" style="width:100%">
  </div>


  <button type="submit" class="btn btn-primary">Save Changes</button>
</form>





{% endblock %}
