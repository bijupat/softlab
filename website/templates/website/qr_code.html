{% extends "website/layout.html" %}
{% load static %}
{% block title %}QR Code for {{ link.short_code }}{% endblock %}
{% block head %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <style>
  .qr-container {
    text-align: center;
    margin-top: 40px;
  }
  .qr-image {
    border: 1px solid #563d7c;
    padding: 15px;
    border-radius: 15px;
    display: inline-block;
    background: #fff;
  }
  .btn-copy {
    margin-top: 15px;
  }
  .url-text {
    margin-top: 20px;
    word-break: break-all;
    font-family: monospace;
    font-size: 1.1rem;
    color: #563d7c;
  }
  </style>
  <script>
  function copyToClipboard() {
    const urlText = document.getElementById('ad-url').textContent;
    navigator.clipboard.writeText(urlText).then(() => {
      alert('URL copied to clipboard!');
    });
  }
  </script>
{% endblock head %}
{% block body %}
  <div class="container qr-container">
    <h1>QR Code for {{ link.advertisement.name }} ({{ link.short_code }})</h1>
    <div class="qr-image">
      <img src="data:image/png;base64,{{ qr_image|safe }}" alt="QR Code" />
    </div>
    <div>
      <button class="btn btn-outline-primary btn-copy" onclick="copyToClipboard()">Copy URL</button>
      <a href="{{ url }}?download=1"
         class="btn btn-outline-secondary btn-copy"
         download>Download QR Code (PNG)</a>
      <a class="btn btn-outline-secondary btn-copy"
         href="{% url 'website:adlink_manage' link.advertisement.id %}">Back</a>
    </div>
    <div class="url-text" id="ad-url">{{ url }}</div>
  </div>
{% endblock body %}
