{% extends "website/layout.html" %}
{% block title %}
    Verify SMS Code
{% endblock title %}
{% block body %}
    <div style="max-width: 400px;
                margin: auto;
                padding: 20px;
                text-align: center">
        <h2>Enter SMS Verification Code</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            <input type="text"
                   name="sms_code"
                   maxlength="6"
                   pattern="\d{6}"
                   required
                   placeholder="6-digit code"
                   style="padding: 10px;
                          width: 100%;
                          margin-bottom: 10px">
            <button type="submit"
                    style="padding: 10px 20px;
                           background-color:#2a9d8f;
                           color:#fff;
                           border:none;
                           cursor:pointer">Verify</button>
        </form>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
{% endblock body %}
