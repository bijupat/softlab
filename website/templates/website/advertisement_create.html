{% extends "website/layout.html" %}
{% load static %}
{% block title %}
    Add New Advertisement
{% endblock title %}
{% block head %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
{% endblock head %}
{% block body %}
    <div class="container my-4">
        <h1 class="mb-4">Add New Advertisement</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Advertisement Name</label>
                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       required
                       maxlength="255"
                       placeholder="Enter advertisement name">
            </div>
            <div class="form-group">
                <label for="platform">Platform</label>
                <input type="text"
                       class="form-control"
                       id="platform"
                       name="platform"
                       required
                       maxlength="100"
                       placeholder="Enter platform (e.g. Facebook, Google)">
            </div>
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea class="form-control"
                          id="notes"
                          name="notes"
                          rows="4"
                          placeholder="Additional notes (optional)"></textarea>
            </div>
            <div class="form-group form-check">
                <input type="checkbox"
                       class="form-check-input"
                       id="is_active"
                       name="is_active"
                       checked>
                <label class="form-check-label" for="is_active">Active</label>
            </div>
            <button type="submit" class="btn btn-primary">Create Advertisement</button>
            <a href="{% url 'website:advertisement_list' %}"
               class="btn btn-secondary ml-2">Cancel</a>
        </form>
    </div>
{% endblock body %}
